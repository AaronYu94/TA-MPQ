<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210"  >
            <rect x="0" y="0" width="620" height="210" fill="#FBFAF7"/>
            <!-- background -->
            <rect x="30" y="30" width="560" height="80" rx="8" fill="#F4F2EF" stroke="#E0DDD8" stroke-width="1.5"/>
            <!-- gradient fill representing spectrum -->
            <defs>
              <linearGradient id="frontierGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#6aaa8a" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#C41230" stop-opacity="0.35"/>
              </linearGradient>
            </defs>
            <rect x="30" y="30" width="560" height="80" rx="8" fill="url(#frontierGrad)"/>

            <!-- 8 sector dividers -->
            <line x1="100" y1="30" x2="100" y2="110" stroke="white" stroke-width="1.5" opacity="0.6"/>
            <line x1="170" y1="30" x2="170" y2="110" stroke="white" stroke-width="1.5" opacity="0.6"/>
            <line x1="240" y1="30" x2="240" y2="110" stroke="white" stroke-width="1.5" opacity="0.6"/>
            <line x1="310" y1="30" x2="310" y2="110" stroke="white" stroke-width="1.5" opacity="0.6"/>
            <line x1="380" y1="30" x2="380" y2="110" stroke="white" stroke-width="1.5" opacity="0.6"/>
            <line x1="450" y1="30" x2="450" y2="110" stroke="white" stroke-width="1.5" opacity="0.6"/>
            <line x1="520" y1="30" x2="520" y2="110" stroke="white" stroke-width="1.5" opacity="0.6"/>

            <!-- Policy dots -->
            <circle cx="65" cy="70" r="8" fill="#C41230" stroke="white" stroke-width="2"/>
            <circle cx="135" cy="70" r="8" fill="#C41230" stroke="white" stroke-width="2"/>
            <circle cx="205" cy="70" r="8" fill="#C41230" stroke="white" stroke-width="2"/>
            <circle cx="275" cy="70" r="10" fill="#C41230" stroke="white" stroke-width="3"/> <!-- best -->
            <circle cx="345" cy="70" r="8" fill="#C41230" stroke="white" stroke-width="2"/>
            <circle cx="415" cy="70" r="8" fill="#C41230" stroke="white" stroke-width="2"/>
            <circle cx="485" cy="70" r="8" fill="#C41230" stroke="white" stroke-width="2"/>
            <circle cx="555" cy="70" r="8" fill="#6aaa8a" stroke="white" stroke-width="2"/>

            <!-- Best label -->
            <text x="275" y="24" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#C41230" font-weight="700">Best policy</text>
            <line x1="275" y1="27" x2="275" y2="58" stroke="#C41230" stroke-width="1.5" stroke-dasharray="3,2"/>

            <!-- Left label -->
            <text x="35" y="125" font-family="Helvetica" font-size="17" fill="#555" font-weight="600">← High INT8 + INT2</text>
            <text x="35" y="145" font-family="Courier" font-size="15" fill="#888">More sensitive layers at INT8</text>

            <!-- Right label -->
            <text x="590" y="125" font-family="Helvetica" font-size="17" fill="#555" font-weight="600" text-anchor="end">Uniform INT4 →</text>
            <text x="590" y="145" font-family="Courier" font-size="15" fill="#888" text-anchor="end">All layers at INT4</text>

            <!-- Budget indicator -->
            <rect x="30" y="160" width="560" height="28" rx="4" fill="#F4F2EF" stroke="#E0DDD8" stroke-width="1"/>
            <text x="320" y="179" text-anchor="middle" font-family="Helvetica" font-size="17" fill="#555" font-weight="600">All policies share identical raw weight footprint (= uniform INT4)</text>
          </svg>
